[package]
name = "spartan-whir"
version = "0.1.0"
edition = "2021"

[lib]
name = "spartan_whir"
path = "src/lib.rs"

[dependencies]
p3-challenger = { path = "../Plonky3/challenger" }
p3-commit = { path = "../Plonky3/commit" }
p3-dft = { path = "../Plonky3/dft" }
p3-field = { path = "../Plonky3/field" }
p3-baby-bear = { path = "../Plonky3/baby-bear" }
p3-keccak = { path = "../Plonky3/keccak" }
p3-koala-bear = { path = "../Plonky3/koala-bear" }
p3-matrix = { path = "../Plonky3/matrix" }
p3-maybe-rayon = { path = "../Plonky3/maybe-rayon" }
p3-merkle-tree = { path = "../Plonky3/merkle-tree" }
p3-multilinear-util = { path = "../Plonky3/multilinear-util" }
p3-sumcheck = { path = "../Plonky3/sumcheck" }
p3-symmetric = { path = "../Plonky3/symmetric" }
p3-util = { path = "../Plonky3/util" }
p3-whir = { path = "../Plonky3/whir" }
libloading = "0.8"
bincode = "1.3"
num-bigint = { version = "0.5.1", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std_rng", "sys_rng"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive", "rc"] }
serde_json = "1.0"
tracing = { version = "0.1.44", default-features = false }

[features]
default = []
# Enables data-parallelism in hot paths via rayon (currently affects the
# grinding loop in `CanonicalSerializingChallenger32::grind`, plus any
# `into_par_iter` calls reachable from this crate). Without this feature,
# `p3-maybe-rayon` falls back to a serial shim and grinding runs on one core.
parallel = ["p3-maybe-rayon/parallel"]

[[bin]]
name = "circom-adapter-check"
path = "src/bin/circom-adapter-check.rs"

[[bin]]
name = "poseidon-schedule-heldout"
path = "src/bin/poseidon-schedule-heldout.rs"

[[bin]]
name = "spark-sha256-layouts"
path = "src/bin/spark-sha256-layouts.rs"

[[example]]
name = "sha256_512b"
path = "examples/sha256_512b.rs"

[[example]]
name = "sha256_bench"
path = "examples/sha256_bench.rs"

[[example]]
name = "end_to_end"
path = "examples/end_to_end.rs"

[dev-dependencies]
criterion = "0.8"
sha2 = "0.10"
tracing = { version = "0.1.44", features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
trybuild = "1"

[[bench]]
name = "sumcheck_replay"
harness = false

[[bench]]
name = "sha256_full_zk"
harness = false
required-features = ["parallel"]

[profile.release]
codegen-units = 1
lto = "fat"

[profile.bench]
codegen-units = 1
lto = "fat"
